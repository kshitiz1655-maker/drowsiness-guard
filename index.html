<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drowsiness Guard</title>
<style>
:root{color-scheme:dark}
body{margin:0 auto;max-width:520px;padding:12px;font:15px system-ui,sans-serif;background:#0f1115;color:#eee}
h1{font-size:18px;margin:0 0 8px}
video{width:100%;border-radius:10px;background:#000;transform:scaleX(-1)}
button{width:100%;padding:14px;font-size:16px;border:0;border-radius:10px;background:#2f7df6;color:#fff;margin:8px 0}
#status{font-size:22px;font-weight:700;margin:8px 0}
.bar{height:22px;background:#2a2d34;border-radius:11px;overflow:hidden}
#bar{height:100%;width:0;background:#2ecc71;transition:width .2s,background .2s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;color:#aab;margin-top:10px}
.msg{font-size:13px;color:#fc6;min-height:18px}
</style>
</head>
<body>
<h1>🚗 Drowsiness Guard (prototype)</h1>
<video id="v" playsinline muted></video>
<button id="go">Start (camera + sensors allow karo)</button>
<div id="status">Ready</div>
<div class="bar"><div id="bar"></div></div>
<div class="msg" id="msg"></div>
<div class="grid" id="info"></div>
<button id="recal" style="display:none;background:#444">Recalibrate</button>
<p class="msg">Phone ko dashboard pe stable lagao, front camera chehre ki taraf.</p>

<script type="module">
import {FaceLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const $=id=>document.getElementById(id);
const CFG={calSec:5,earFactor:.7,perclosWin:60,perclosLim:.25,marThr:.6,yawnSec:1.2,yawnWin:120,yawnFull:3,
  nodDev:.1,nodSec:2,microSec:2,l1:40,l2:70,baseCam:.8,baseMot:.2};
const R=[33,160,158,133,153,144],L=[362,385,387,263,373,380];
const MV=[[13,14],[82,87],[312,317]],MH=[78,308];

const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ear=(p,i)=>(d(p[i[1]],p[i[5]])+d(p[i[2]],p[i[4]]))/(2*d(p[i[0]],p[i[3]]));
const mar=p=>MV.reduce((s,[a,b])=>s+d(p[a],p[b]),0)/MV.length/d(p[MH[0]],p[MH[1]]);
const pitch=p=>{const m=(p[33].y+p[263].y)/2,h=p[152].y-m;return h>0?(p[1].y-m)/h:0};
const med=a=>[...a].sort((x,y)=>x-y)[a.length>>1];
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));

let lm,running=false,audio,lastBeep=0,lastT=-1,luma=128,lumaT=0;
let cal={on:true,t0:null,e:[],p:[]},earTh=.2,pitchBase=0;
let hist=[],closedSince=null,yawnSince=null,yawnCounted=false,yawns=[],nodSince=null;
let accs=[],peaks=[],wasHigh=false;

// ---------- Motion sensor ----------
addEventListener("devicemotion",e=>{
  const t=performance.now()/1000,a=e.accelerationIncludingGravity,r=e.rotationRate;
  if(a&&a.x!=null)accs.push([t,Math.hypot(a.x,a.y,a.z)]);
  if(r&&r.alpha!=null){
    const high=Math.hypot(r.alpha,r.beta,r.gamma)>10; // deg/s: steering correction jaisa jerk
    if(high&&!wasHigh)peaks.push(t);
    wasHigh=high;
  }
  while(accs.length&&t-accs[0][0]>2)accs.shift();
  while(peaks.length&&t-peaks[0]>30)peaks.shift();
});
function motionConf(){ // motion signal par kitna bharosa
  if(accs.length<10)return .1;
  const v=accs.map(x=>x[1]),m=v.reduce((a,b)=>a+b)/v.length;
  const s=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/v.length);
  return s<.05?.1:s>3?.4:.9; // gaadi ruki / bahut kharab road = kam bharosa
}

// ---------- Brightness ----------
const cv=document.createElement("canvas");cv.width=32;cv.height=24;
const cx=cv.getContext("2d",{willReadFrequently:true});
function sampleLuma(v){
  cx.drawImage(v,0,0,32,24);
  const D=cx.getImageData(0,0,32,24).data;let s=0;
  for(let i=0;i<D.length;i+=4)s+=.299*D[i]+.587*D[i+1]+.114*D[i+2];
  return s/(D.length/4);
}

// ---------- Alert ----------
function beep(level){
  const n=performance.now();
  if(n-lastBeep<(level==1?3000:1000))return;
  lastBeep=n;
  const o=audio.createOscillator(),g=audio.createGain();
  o.frequency.value=level==1?1000:2200;g.gain.value=.3;
  o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+(level==1?.2:.5));
  if(navigator.vibrate)navigator.vibrate(level==1?100:[300,100,300]);
}

// ---------- Main step ----------
function step(res,t,W,H){
  let camSig=0,camConf=0,cd=0,perclos=0,e=0,m=0,nd=0,txt="";
  const motSig=clamp(peaks.length/6),motConf=motionConf();
  const f=res.faceLandmarks&&res.faceLandmarks[0];
  if(!f){closedSince=yawnSince=nodSince=null;txt="Face nahi mila";}
  else{
    const p=f.map(q=>({x:q.x*W,y:q.y*H}));
    e=(ear(p,L)+ear(p,R))/2;m=mar(p);const pt=pitch(p);
    camConf=clamp((luma-35)/45); // andhera = camera pe kam bharosa
    if(cal.on){
      if(cal.t0===null)cal.t0=t;
      cal.e.push(e);cal.p.push(pt);
      const left=CFG.calSec-(t-cal.t0);
      txt=`Calibration: seedha dekho, aankhein khuli (${Math.max(0,left).toFixed(0)}s)`;
      if(left<=0){earTh=med(cal.e)*CFG.earFactor;pitchBase=med(cal.p);cal.on=false;}
    }else{
      const closed=e<earTh;
      hist.push([t,closed]);
      while(hist[0][0]<t-CFG.perclosWin)hist.shift();
      perclos=hist.filter(h=>h[1]).length/hist.length;
      if(closed){if(closedSince===null)closedSince=t;cd=t-closedSince}else closedSince=null;
      if(m>CFG.marThr){
        if(yawnSince===null){yawnSince=t;yawnCounted=false}
        if(!yawnCounted&&t-yawnSince>=CFG.yawnSec){yawns.push(t);yawnCounted=true}
      }else yawnSince=null;
      while(yawns.length&&t-yawns[0]>CFG.yawnWin)yawns.shift();
      if(Math.abs(pt-pitchBase)>CFG.nodDev){if(nodSince===null)nodSince=t;nd=t-nodSince}else nodSince=null;
      const eye=clamp(Math.max(perclos/CFG.perclosLim,cd/1.5));
      camSig=.6*eye+.2*clamp(yawns.length/CFG.yawnFull)+.2*clamp(nd/CFG.nodSec);
    }
  }

  // ---------- Confidence-weighted fusion ----------
  const wc=CFG.baseCam*camConf,wm=CFG.baseMot*motConf;
  let score=0;
  if(!cal.on){
    if(wc+wm>.01)score=100*(wc*camSig+wm*motSig)/(wc+wm);
    if(cd>=CFG.microSec&&camConf>.5)score=Math.max(score,85);
  }
  let status=txt||"OK",color="#2ecc71";
  if(!cal.on){
    if(score>=CFG.l2){status="ALARM! Gaadi side me roko";color="#e74c3c";beep(2)}
    else if(score>=CFG.l1){status="WARNING";color="#f5a623";beep(1)}
    else if(f)status="OK";
  }
  $("status").textContent=status;$("status").style.color=cal.on?"#eee":color;
  $("bar").style.width=score+"%";$("bar").style.background=color;
  const share=wc+wm>0?Math.round(100*wc/(wc+wm)):0;
  $("info").innerHTML=[
    `EAR ${e.toFixed(2)} (th ${earTh.toFixed(2)})`,`PERCLOS ${(perclos*100).toFixed(0)}%`,
    `MAR ${m.toFixed(2)}`,`Yawns ${yawns.length} | Nod ${nd.toFixed(1)}s`,
    `Camera signal ${camSig.toFixed(2)} | conf ${camConf.toFixed(2)}`,
    `Motion signal ${motSig.toFixed(2)} | conf ${motConf.toFixed(2)}`,
    `Weight: camera ${share}% / motion ${100-share}%`,`Score ${score.toFixed(0)}/100`
  ].map(x=>`<div>${x}</div>`).join("");
}

function loop(){
  if(!running)return;
  const v=$("v"),t=performance.now()/1000;
  if(v.readyState>=2&&v.currentTime!==lastT){
    lastT=v.currentTime;
    if(t-lumaT>.5){luma=sampleLuma(v);lumaT=t}
    step(lm.detectForVideo(v,performance.now()),t,v.videoWidth,v.videoHeight);
  }
  requestAnimationFrame(loop);
}

// ---------- Start ----------
$("go").onclick=async()=>{
  try{
    audio=new (window.AudioContext||window.webkitAudioContext)();
    if(window.DeviceMotionEvent&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission();
    $("msg").textContent="Model load ho raha hai (pehli baar thoda time lagega)...";
    const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const make=delegate=>FaceLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate},
      runningMode:"VIDEO",numFaces:1});
    try{lm=await make("GPU")}catch{lm=await make("CPU")}
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:480,height:360},audio:false});
    $("v").srcObject=stream;await $("v").play();
    try{await navigator.wakeLock.request("screen")}catch{}
    $("msg").textContent="";$("go").style.display="none";$("recal").style.display="block";
    running=true;loop();
  }catch(err){$("msg").textContent="Error: "+err.message}
};
$("recal").onclick=()=>{cal={on:true,t0:null,e:[],p:[]};hist=[];yawns=[];closedSince=yawnSince=nodSince=null};
</script>
</body>
</html>
